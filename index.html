<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorfly-studio</title>
    <link rel="preload" href="/fonts" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1 class="header"> //colorfly studio</h1>
        <h2 class="description">
            Your online friend to create amazing color palettes.</h2>
    </header>



    <main class="container">

        <section class="galery">
            <button id="generate">CREATE</button>
            <div class="control-group">
                <P id="title-size">PALETTE SIZE</P>
                <div id="button-amount-of-colors">

                    <button id="amount-of-colors-6">6</button>
                    <button id="amount-of-colors-8">8</button>
                    <button id="amount-of-colors-9">9</button>
                </div>
            </div>


            </div>
            <p class="color-style">HSL</p>
            <div id="button-mode">
                <button id="hex"></button>
                <button id="hsl"></button>
            </div>
            <p class="color-style">HEX</p>
            </div>

        </section>
        <div id="palette-container">
            <div id="palette-code">
                <button class="palette-created"></button>
                <h3 class="hsl-value"></h3>
            </div>
        </div>



    </main>
    <div id="toast-copied">HEX COPIED
    </div>

    <script src="script.js"></script>
</body>
<footer>2026 - Martin Cocchi Nan</footer>

</html>
