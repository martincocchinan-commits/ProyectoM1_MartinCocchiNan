<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorfly-studio</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div id="titulo">
            <h1 class="header"> COLORFLY STUDIO </h1>
        </div>
        <p class="descripcion">
        <h2> Your online friend to create amazing color palettes.</h2>
        </p>
        </div>
    </header>



    <main class="container">

        <section class="galery">

            <div id="button-amount-of-colors">
                <button id="amount-of-colors-6">6</button>
                <button id="amount-of-colors-8">8</button>
                <button id="amount-of-colors-9">9</button>
            </div>
            <div>
                <button id="generate">generate</button>
                <button id="hex">hex</button>
                <button id="hsl">hsl</button>
            </div>
            <article id="palette-container">
                <div id="palette-code">
                    <button class="palette-created"></button>
                    <h3 class="hsl-value"></h3>
                </div>
            </article>

        </section>

    </main>

    <script src="/script.js"></script>
</body>

</html>
